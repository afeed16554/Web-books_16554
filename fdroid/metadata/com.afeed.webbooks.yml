Description: |-
  Web Books is an open-source, distraction-free educational concept reader
  and notebook designed for students and researchers.
  Features:
  * Complete NCTB Bangla & English curriculum (Class 1 to 12)
  * Chemistry reaction mechanisms with KaTeX mhchem and adaptive SVGs
  * Multi-form-factor support: Phones, Tablets, Foldables, and Samsung DeX
  * Pitch-Black OLED Dark Mode, Yellow Paper Reading Mode, and Light Mode
  * 100% offline-ready Progressive Web App & Android build

