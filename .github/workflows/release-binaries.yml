name: Build and Release Native Binaries

on:
  push:
    tags:
      - 'v*' # Workflow triggers when you push a tag like v1.0.0

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies and Build Web
        run: |
          bun install
          bun run build
          
      - name: Build Windows EXE
        run: bun run electron:dist
        
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-builds/**/*.exe

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install and Build Web
        run: |
          bun install
          bun run build
          bunx cap sync android
          
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug 
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/**/*.apk

  create-github-release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-exe/**/*.exe
            android-apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
